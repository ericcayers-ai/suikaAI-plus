name: Feature request
description: Suggest a feature, a new AI technique, or an improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: The motivation — what's missing or awkward today.
      placeholder: There's no way to compare two ensembles side by side because...
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What you'd like to see. For a new AI technique, name the algorithm and a reference.
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: Kind of request
      options:
        - New AI technique or ensemble
        - Training / benchmarking improvement
        - Game or UI feature
        - RT Lab / rendering
        - Developer experience / docs / CI
        - Other
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about, and why this one is better.
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and this isn't a duplicate.
          required: true
