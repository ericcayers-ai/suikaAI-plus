name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ["21"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: "temurin"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Build all modules
        run: ./gradlew build -x test --parallel

      - name: Run suika-core unit tests
        run: ./gradlew :suika-core:test --parallel

      - name: Run suika-env unit tests
        run: ./gradlew :suika-env:test --parallel

      - name: Run suika-bridge unit tests
        run: ./gradlew :suika-bridge:test --parallel

      - name: Run suika-ai unit tests
        run: ./gradlew :suika-ai:test --parallel

      - name: Run suika-game unit tests
        run: ./gradlew :suika-game:test --parallel

      - name: Run suika-assets unit tests
        run: ./gradlew :suika-assets:test --parallel

      - name: Run suika-dash unit tests
        run: ./gradlew :suika-dash:test --parallel

      - name: Run suika-app unit tests
        run: ./gradlew :suika-app:test --parallel

      - name: Bounded benchmark floor gate
        run: ./gradlew :suika-ai:test --tests "dev.suika.ai.BenchmarkFloorTest" --rerun-tasks

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-java-${{ matrix.java }}
          path: "**/build/reports/tests/"

  python-lint-and-test:
    name: Python lint + pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package + test deps
        run: |
          pip install ruff pytest
          pip install -e "./python"
      - name: Lint
        run: ruff check python/
      - name: Contract pytest
        working-directory: python
        run: pytest -q

  # Bounded capture matrix on every PR/push — tiny axis count so GitHub-hosted
  # runners finish in a few minutes. Wider sweeps stay on workflow_dispatch below.
  # RT capture is not run here (no ray-tracing GPU on GH runners).
  capture-smoke:
    name: Capture harness (bounded smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Install a virtual display (xvfb)
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Build the app distribution
        run: ./gradlew :suika-app:installDist --parallel

      - name: Run bounded capture (portrait smoke)
        env:
          JAVA_OPTS: >-
            -Dsuika.capture.dir=${{ github.workspace }}/capture-out/smoke
            -Dsuika.capture.mode=matrix
            -Dsuika.capture.techniques=mcts,heuristic
            -Dsuika.capture.columns=32
            -Dsuika.capture.speeds=1
            -Dsuika.capture.durations=2
            -Dsuika.capture.max=8
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24" \
            suika-app/build/install/suika-app/bin/suika-app

      - name: Fail on any reported anomaly
        run: |
          if grep -rl '\[!!\]' capture-out/*/report.txt 2>/dev/null; then
            echo "::error::Capture smoke reported an anomaly — see report.txt above."
            grep -r '\[!!\]' capture-out/*/report.txt
            exit 1
          fi
          echo "No anomalies reported."

      - name: Upload smoke screenshots + reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capture-smoke-results
          path: capture-out/

  # Wider opt-in matrix (manual "Run workflow" only).
  capture-matrix:
    name: Capture-harness debug matrix (opt-in)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Install a virtual display (xvfb)
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Build the app distribution
        run: ./gradlew :suika-app:installDist --parallel

      - name: Run the matrix capture (bounded axes) — portrait
        env:
          JAVA_OPTS: >-
            -Dsuika.capture.dir=${{ github.workspace }}/capture-out/portrait
            -Dsuika.capture.mode=matrix
            -Dsuika.capture.techniques=mcts,neuroevo,dagger,ppo
            -Dsuika.capture.columns=32
            -Dsuika.capture.speeds=1
            -Dsuika.capture.durations=4
            -Dsuika.capture.max=40
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24" \
            suika-app/build/install/suika-app/bin/suika-app

      - name: Run the matrix capture (bounded axes) — landscape
        env:
          JAVA_OPTS: >-
            -Dsuika.capture.dir=${{ github.workspace }}/capture-out/landscape
            -Dsuika.capture.land=true
            -Dsuika.capture.mode=matrix
            -Dsuika.capture.techniques=mcts,neuroevo
            -Dsuika.capture.columns=32
            -Dsuika.capture.speeds=1
            -Dsuika.capture.durations=4
            -Dsuika.capture.max=20
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24" \
            suika-app/build/install/suika-app/bin/suika-app

      - name: Fail on any reported anomaly
        run: |
          if grep -rl '\[!!\]' capture-out/*/report.txt 2>/dev/null; then
            echo "::error::Capture matrix reported an anomaly — see report.txt above."
            grep -r '\[!!\]' capture-out/*/report.txt
            exit 1
          fi
          echo "No anomalies reported."

      - name: Upload screenshots + reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capture-matrix-results
          path: capture-out/
